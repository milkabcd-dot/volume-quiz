<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בלשי הנפח - חידון חשיפת הפאזל</title>
    <!-- ספריות קונפטי וצלילים -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            color: #4b5563;
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            box-sizing: border-box;
        }
        /* אזור הפאזל */
        .puzzle-container {
            position: relative;
            width: 350px;
            height: 350px;
            border: 5px solid #2563eb;
            border-radius: 12px;
            overflow: hidden;
            background-color: #e5e7eb;
            flex-shrink: 0;
        }
        canvas#labCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* רשת אריחים 3x3 מדויקת (9 קוביות) */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }
        .tile {
            background-color: #1e293b;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 22px;
            transition: opacity 0.6s ease, transform 0.3s ease;
        }
        .tile.revealed {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.1);
        }
        /* אזור השאלות */
        .quiz-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .question-box h3 {
            color: #1d4ed8;
            margin-top: 0;
        }
        .question-box p {
            font-size: 18px;
            color: #1f2937;
            font-weight: bold;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 12px 18px;
            margin: 10px 0;
            background-color: #f8fafc;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-align: right;
            transition: all 0.2s;
            color: #334155;
        }
        .options button:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
            transform: translateY(-2px);
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
            min-height: 25px;
        }
        .success-msg { color: #16a34a; }
        .error-msg { color: #dc2626; }
        
        #finish-screen {
            display: none;
            text-align: center;
            padding: 20px;
        }
        #finish-screen h2 {
            color: #16a34a;
            font-size: 28px;
        }
        .restart-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .restart-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>בלשי הנפח - חידון חשיפת הפאזל</h1>
    <p class="subtitle">ענו נכון על השאלות במדעים כדי לחשוף את תמונת המעבדה המסתורית!</p>

    <div class="container">
        <!-- אזור הפאזל והתמונה -->
        <div class="puzzle-container">
            <canvas id="labCanvas" width="700" height="700"></canvas>
            
            <!-- 9 קוביות פאזל תואמות בדיוק ל-9 השאלות -->
            <div class="grid-overlay" id="gridOverlay">
                <div class="tile" id="tile-0">1</div>
                <div class="tile" id="tile-1">2</div>
                <div class="tile" id="tile-2">3</div>
                <div class="tile" id="tile-3">4</div>
                <div class="tile" id="tile-4">5</div>
                <div class="tile" id="tile-5">6</div>
                <div class="tile" id="tile-6">7</div>
                <div class="tile" id="tile-7">8</div>
                <div class="tile" id="tile-8">9</div>
            </div>
        </div>

        <!-- אזור השאלות -->
        <div class="quiz-section">
            <div id="quiz-container"></div>
            <div id="finish-screen">
                <h2>כל הכבוד! חשפתם את כל התמונה! 🎉</h2>
                <p>הוכחתם שליטה מצוינת בנושא נפח ומדידות!</p>
                <button class="restart-btn" onclick="restartQuiz()">שחק שוב</button>
            </div>
        </div>
    </div>

    <script>
        // ציור תמונת מעבדה נקייה ב-100% מכל מילה
        function drawCleanLabImage() {
            const canvas = document.getElementById('labCanvas');
            const ctx = canvas.getContext('2d');
            
            // רקע
            ctx.fillStyle = '#eef2ff';
            ctx.fillRect(0, 0, 700, 700);
            
            // שולחן
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(0, 520, 700, 180);
            ctx.fillStyle = '#64748b';
            ctx.fillRect(0, 500, 700, 20);

            // משורה במרכז עם נוזל כחול ומניסקוס
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 6;
            ctx.fillRect(280, 150, 140, 350);
            ctx.strokeRect(280, 150, 140, 350);
            
            ctx.fillStyle = 'rgba(59, 130, 246, 0.6)';
            ctx.fillRect(286, 250, 128, 244);
            
            ctx.beginPath();
            ctx.ellipse(350, 250, 64, 15, 0, 0, Math.PI);
            ctx.fillStyle = '#2563eb';
            ctx.fill();

            // שערות מדידה (ללא מספרים)
            ctx.strokeStyle = '#1d4ed8';
            ctx.lineWidth = 3;
            for(let y = 180; y < 490; y += 30) {
                ctx.beginPath();
                ctx.moveTo(280, y);
                ctx.lineTo(310, y);
                ctx.stroke();
            }

            // כוס כימית משמאל
            ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 5;
            ctx.fillRect(80, 280, 130, 220);
            ctx.strokeRect(80, 280, 130, 220);
            
            ctx.fillStyle = 'rgba(16, 185, 129, 0.5)';
            ctx.fillRect(85, 340, 120, 155);

            // בקבוק ארלנמייר מימין
            ctx.beginPath();
            ctx.moveTo(530, 280);
            ctx.lineTo(570, 280);
            ctx.lineTo(620, 500);
            ctx.lineTo(480, 500);
            ctx.closePath();
            ctx.fillStyle = 'rgba(168, 85, 247, 0.5)';
            ctx.fill();
            ctx.strokeStyle = '#9333ea';
            ctx.lineWidth = 5;
            ctx.stroke();

            // בועות צפות
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            const bubbles = [{x:330,y:380,r:8}, {x:370,y:310,r:12}, {x:140,y:400,r:10}, {x:540,y:420,r:9}];
            bubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // 9 שאלות מדויקות לכיתה ז'
        const questions = [
            {
                q: "מהי ההגדרה המדעית לנפח?",
                options: ["כמות החומר שיש בגוף", "גודל החלל שגוף תופס במרחב", "מידת הכבידה שפועלת על הגוף", "משקל החומר ביחס לנפחו"],
                correct: 1
            },
            {
                q: "מהן יחידות המידה המקובלות לנפח של נוזל?",
                options: ["קילוגרם וגרם", "מטר רבוע וסנטימטר רבוע", "מיליליטר (ml) וליטר (L)", "מטר לשנייה"],
                correct: 2
            },
            {
                q: "באמצעות איזה כלי מעבדה מקובל למדוד נפח של נוזל בדיוק יחסי טוב?",
                options: ["משורה", "משקל דיגיטלי", "סרגל פלסטיק", "מדחום"],
                correct: 0
            },
            {
                q: "כאשר מדדים נפח של נוזל במשורה, כיצד יש להסתכל על פני הנוזל (המניסקוס)?",
                options: ["מלמעלה כלפי מטה בזווית חדה", "מלמטה כלפי מעלה", "בגובה העיניים, בדיוק מול קו הקעירות של הנוזל", "אין חשיבות לזווית ההסתכלות"],
                correct: 2
            },
            {
                q: "כמה מיליליטר (ml) יש בליטר אחד (L)?",
                options: ["10 מיליליטר", "100 מיליליטר", "1,000 מיליליטר", "10,000 מיליליטר"],
                correct: 2
            },
            {
                q: "כיצד ניתן למדוד נפח של גוף מוצק בעל צורה לא סדירה (למשל: אבן קטנה)?",
                options: ["על ידי שקילה במאזניים", "על ידי טבילה במים במשורה ומדידת עליית מפלס המים", "על ידי מדידת אורך, רוחב וגובה בסרגל", "אי אפשר למדוד נפח של גוף לא סדיר"],
                correct: 1
            },
            {
                q: "אם נכניס אבן שנפחה 20 סמ\"ק לתוך משורה שיש בה 50 מ\"ל מים, מה יהיה מפלס המים החדש?",
                options: ["30 מ\"ל", "50 מ\"ל", "70 מ\"ל", "1,000 מ\"ל"],
                correct: 2
            },
            {
                q: "מה קורה לנפח של חומר במצב צבירה גז כאשר מעבירים אותו מבלון קטן לבלון ענק?",
                options: ["הנפח גדל ומתמלא בכל חלל הבלון החדש", "הנפח מצטמצם לאפס", "הנפח נשאר קבוע בדיוק כפי שהיה", "הגז הופך לנוזל"],
                correct: 0
            },
            {
                q: "מדוע, בניגוד לגזים, לנוזלים ולמוצקים יש נפח קבוע ומוגדר?",
                options: ["כי החלקיקים שלהם צפופים יותר וקשורים זה לזה בכוחות משיכה חזקים יחסית", "כי אין להם כלל חלקיקים", "כי הם נמצאים תמיד בטמפרטורה נמוכה", "כי הם קלים מדי מכדי לזוז"],
                correct: 0
            }
        ];

        let currentQuestionIndex = 0;
        const quizContainer = document.getElementById('quiz-container');
        const finishScreen = document.getElementById('finish-screen');

        // פונקציות צלילים
        function playCorrectSound() {
            try {
                Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth).toDestination();
                const now = Tone.now();
                synth.triggerAttackRelease("C5", "8n", now);
                synth.triggerAttackRelease("E5", "8n", now + 0.1);
                synth.triggerAttackRelease("G5", "8n", now + 0.2);
            } catch(e) {}
        }

        function playWrongSound() {
            try {
                Tone.start();
                const synth = new Tone.Synth().toDestination();
                synth.triggerAttackRelease("F3", "8n");
            } catch(e) {}
        }

        function playVictorySound() {
            try {
                Tone.start();
                const synth = new Tone.PolySynth(Tone.Synth).toDestination();
                const now = Tone.now();
                synth.triggerAttackRelease("C5", "8n", now);
                synth.triggerAttackRelease("E5", "8n", now + 0.15);
                synth.triggerAttackRelease("G5", "8n", now + 0.3);
                synth.triggerAttackRelease("C6", "4n", now + 0.45);
            } catch(e) {}
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                quizContainer.style.display = 'none';
                finishScreen.style.display = 'block';
                playVictorySound();
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                return;
            }

            const qData = questions[currentQuestionIndex];
            let html = `
                <div class="question-box">
                    <h3>שאלה ${currentQuestionIndex + 1} מתוך ${questions.length}:</h3>
                    <p>${qData.q}</p>
                    <div class="options">
            `;

            qData.options.forEach((opt, index) => {
                html += `<button onclick="checkAnswer(${index})">${opt}</button>`;
            });

            html += `</div><div class="feedback" id="feedback"></div></div>`;
            quizContainer.innerHTML = html;
        }

        function checkAnswer(selectedIndex) {
            const qData = questions[currentQuestionIndex];
            const feedbackDiv = document.getElementById('feedback');

            if (selectedIndex === qData.correct) {
                feedbackDiv.innerHTML = "<span class='success-msg'>תשובה נכונה! חלק מהפאזל נחשף! 🧩</span>";
                playCorrectSound();
                document.getElementById(`tile-${currentQuestionIndex}`).classList.add('revealed');
                currentQuestionIndex++;
                setTimeout(() => { loadQuestion(); }, 1200);
            } else {
                feedbackDiv.innerHTML = "<span class='error-msg'>טעות, נסו שוב! ❌</span>";
                playWrongSound();
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            finishScreen.style.display = 'none';
            quizContainer.style.display = 'block';
            for (let i = 0; i < questions.length; i++) {
                document.getElementById(`tile-${i}`).classList.remove('revealed');
            }
            loadQuestion();
        }

        // הפעלה ראשונית
        drawCleanLabImage();
        loadQuestion();
    </script>
</body>
</html>
