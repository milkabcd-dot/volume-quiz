<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בלשי הנפח - חידון חשיפת הפאזל</title>
    <!-- ספריות קונפטי וצלילים -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 5px;
            text-align: center;
        }
        p.subtitle {
            color: #4b5563;
            margin-bottom: 10px;
            font-size: 18px;
            text-align: center;
        }
        .creator-credit {
            color: #2563eb;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            box-sizing: border-box;
        }
        /* אזור הפאזל */
        .puzzle-container {
            position: relative;
            width: 350px;
            height: 350px;
            border: 5px solid #2563eb;
            border-radius: 12px;
            overflow: hidden;
            background-color: #e5e7eb;
            flex-shrink: 0;
        }
        canvas#labCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* רשת אריחים 3x3 מדויקת (9 קוביות) */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }
        .tile {
            background-color: #1e293b;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 22px;
            transition: opacity 0.6s ease, transform 0.3s ease;
        }
        .tile.revealed {
